name: Generate Upload Keystore

# One-off helper to mint a valid Android upload keystore entirely in GitHub
# (no local machine needed). It produces an artifact containing the keystore,
# its base64 encoding, and the generated passwords. Download the artifact and
# copy the values into the repository's Actions secrets:
#   RELEASE_KEYSTORE  -> contents of release-keystore.b64.txt
#   STORE_PASSWORD    -> from secrets.txt
#   KEY_PASSWORD      -> from secrets.txt
# The key alias is "upload" to match app/build.gradle.kts.
#
# After publishing your first release, enroll in Play App Signing and keep this
# keystore safe — it is your upload key.

on:
  workflow_dispatch:
    inputs:
      validity_days:
        description: 'Keystore validity in days'
        default: '10000'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          set -euo pipefail
          STORE_PASSWORD="$(openssl rand -base64 24)"
          KEY_PASSWORD="$STORE_PASSWORD"

          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA -keysize 2048 \
            -validity "${{ inputs.validity_days }}" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Radio Bulgaria, OU=Mind2Code, O=Mind2Code, L=Sofia, ST=Sofia, C=BG"

          base64 -w0 my-upload-key.jks > release-keystore.b64.txt

          {
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo "KEY_ALIAS=upload"
          } > secrets.txt

          # Sanity-check that the keystore is readable with the password.
          keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias upload

      - name: Upload keystore bundle (download, then set secrets, then delete)
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore-bundle
          path: |
            my-upload-key.jks
            release-keystore.b64.txt
            secrets.txt
          retention-days: 1

      - name: Instructions
        run: |
          echo "### Upload keystore generated :key:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "1. Download the **upload-keystore-bundle** artifact from this run." >> "$GITHUB_STEP_SUMMARY"
          echo "2. In repo **Settings → Secrets and variables → Actions**, set:" >> "$GITHUB_STEP_SUMMARY"
          echo "   - \`RELEASE_KEYSTORE\` = full contents of \`release-keystore.b64.txt\`" >> "$GITHUB_STEP_SUMMARY"
          echo "   - \`STORE_PASSWORD\` and \`KEY_PASSWORD\` = values from \`secrets.txt\`" >> "$GITHUB_STEP_SUMMARY"
          echo "3. Keep \`my-upload-key.jks\` somewhere safe — it is your upload key." >> "$GITHUB_STEP_SUMMARY"
          echo "4. Delete the artifact after you've stored the secrets (it expires in 1 day)." >> "$GITHUB_STEP_SUMMARY"
