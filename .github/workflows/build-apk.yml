name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Also build and sign the release AAB'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper
        run: gradle wrapper

      - name: Decode debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Create .env file
        run: cp .env.example .env

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Check 16 KB native library alignment
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          WORK=$(mktemp -d)
          unzip -o -q "$APK" 'lib/*' -d "$WORK" || true
          mapfile -t SOS < <(find "$WORK" -name '*.so' 2>/dev/null)
          if [ "${#SOS[@]}" -eq 0 ]; then
            echo "No bundled native libraries — nothing to align."
            exit 0
          fi
          BAD=0
          for so in "${SOS[@]}"; do
            max=0
            for a in $(readelf -lW "$so" | awk '/LOAD/ {print $NF}'); do
              d=$(printf '%d' "$a" 2>/dev/null || echo 0)
              [ "$d" -gt "$max" ] && max=$d
            done
            if [ "$max" -ge 16384 ]; then
              echo "OK    $(basename "$so") (max LOAD align=$max)"
            else
              echo "FAIL  $(basename "$so") (max LOAD align=$max, needs >= 16384)"
              BAD=1
            fi
          done
          if [ "$BAD" -ne 0 ]; then
            echo "::warning::Some native libraries are not 16 KB aligned. Google Play requires 16 KB page support for apps targeting API 35+. Update the offending library or AGP."
          else
            echo "All bundled native libraries are 16 KB aligned."
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-bulgaria-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        run: printf '%s' "$RELEASE_KEYSTORE" | base64 -d > my-upload-key.jks
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}

      - name: Build release AAB
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        run: ./gradlew :app:bundleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload release AAB
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: actions/upload-artifact@v4
        with:
          name: radio-bulgaria-release
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
